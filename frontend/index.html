<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>IDS SOC Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">

    <aside class="sidebar">
      <h2>IDS SOC</h2>
      <button data-view="charts">📊 Overview</button>
      <button data-view="alerts">🕒 Alerts</button>
      <button data-view="incidents">🚨 Incidents</button>
    </aside>

    <main class="content">
      <section id="charts" class="view"></section>
      <section id="alerts" class="view hidden"></section>
      <section id="incidents" class="view hidden"></section>
      <section id="modal"></section>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="js/main.js"></script>
</body>

</html>
