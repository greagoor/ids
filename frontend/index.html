<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDS Detection Platform</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/charts.css">
  <link rel="stylesheet" href="css/alerts.css">
  <link rel="stylesheet" href="css/incidents.css">
</head>

<body>

  <!-- VIDEO BACKGROUND -->
  <video autoplay muted loop playsinline class="bg-video">
    <source src="css/background.mp4" type="video/mp4">
  </video>

  <!-- Overlay -->
  <div class="video-overlay"></div>

  <div class="app">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="brand">IDS Detection Platform</div>

      <div class="system-status">
        <div class="status-item">
          <span class="status-indicator active"></span>
          Engine Online
        </div>

        <div class="status-item">
          <span class="status-indicator"></span>
          ML Model Loaded
        </div>

        <div class="live-clock" id="clock"></div>
      </div>
    </header>

    <!-- LAYOUT -->
    <div class="layout">

      <!-- SIDEBAR -->
      <aside class="sidebar">
        <button data-view="overview" class="nav-btn active">Overview</button>
        <button data-view="alerts" class="nav-btn">Alerts</button>
        <button data-view="incidents" class="nav-btn">Incidents</button>
      </aside>

      <!-- CONTENT -->
      <main class="content">

        <!-- ===================== -->
        <!-- OVERVIEW SECTION      -->
        <!-- ===================== -->
        <section id="overview" class="view">

          <!-- KPIs -->
          <section class="kpi-row">

            <div class="kpi-card">
              <h4>Total Alerts</h4>
              <p id="kpi-total">0</p>
            </div>

            <div class="kpi-card">
              <h4>Active Incidents</h4>
              <p id="kpi-incidents">0</p>
            </div>

            <div class="kpi-card">
              <h4>Top Attacker (24h)</h4>
              <p id="kpi-success">N/A</p>
            </div>

            <div class="kpi-card">
              <h4>High Severity Alerts</h4>
              <p id="kpi-high">0</p>
            </div>

          </section>

          <!-- Charts -->
          <section id="charts"></section>

        </section>


        <!-- ===================== -->
        <!-- ALERTS SECTION        -->
        <!-- ===================== -->
        <section id="alerts" class="view hidden"></section>


        <!-- ===================== -->
        <!-- INCIDENTS SECTION     -->
        <!-- ===================== -->
        <section id="incidents" class="view hidden"></section>


        <!-- MODAL -->
        <section id="modal"></section>

      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="js/main.js"></script>

  <script>
document.addEventListener("DOMContentLoaded", () => {

  const buttons = document.querySelectorAll(".nav-btn");
  const views = document.querySelectorAll(".view");

  buttons.forEach(btn => {
    btn.addEventListener("click", () => {

      buttons.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      const target = btn.dataset.view;

      views.forEach(view => {
        if (view.id === target) {
          view.classList.remove("hidden");
        } else {
          view.classList.add("hidden");
        }
      });

    });
  });

});
</script>


</body>
</html>
